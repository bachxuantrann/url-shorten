name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: url-shortener
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration test dùng Testcontainers (Postgres, Redis, Kafka) — runner đã có sẵn Docker
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: url-shortener/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: url-shortener/frontend/package-lock.json

      - run: npm ci
      # build chạy tsc --noEmit trước nên đã gồm kiểm tra kiểu
      - run: npm run build
      - run: npm test
