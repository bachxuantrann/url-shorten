# =============================================
#  docker-compose.dev.yml
#  Mục đích: Chạy hạ tầng (Infrastructure) cho môi trường DEV local.
#  Không build/chạy BE — Spring Boot chạy trực tiếp từ IDE.
#
#  Cách dùng:
#    docker compose -f docker-compose.dev.yml up -d
#    docker compose -f docker-compose.dev.yml down
# =============================================

name: url-shortener-dev

services:

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-url_shortener_db}
      POSTGRES_USER: ${DB_USERNAME:-auradev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auradev123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-auradev} -d ${DB_NAME:-url_shortener_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dev_network

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis_dev
    restart: unless-stopped
    command: redis-server --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  # ===== Kafka (KRaft mode — no Zookeeper) =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: url_shortener_kafka_dev
    restart: unless-stopped
    environment:
      # KRaft — không cần Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Topic / replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka_dev_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - dev_network

  # ===== Kafka UI (tuỳ chọn — giao diện quản lý Kafka) =====
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: url_shortener_kafka_ui_dev
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    networks:
      - dev_network

# ===== VOLUMES =====
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  kafka_dev_data:
    driver: local

# ===== NETWORKS =====
networks:
  dev_network:
    driver: bridge
