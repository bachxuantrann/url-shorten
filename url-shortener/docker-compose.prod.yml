# =============================================
#  docker-compose.prod.yml
#  Mục đích: Full-stack production deployment.
#  Bao gồm: Caddy (HTTPS, UI, rate limit) + build BE từ Dockerfile + tất cả infra.
#  Chỉ Caddy mở cổng ra host (80/443); app, postgres, redis, kafka chỉ nằm trong mạng Docker.
#
#  Yêu cầu: File .env.prod trong cùng thư mục (không commit lên git)
#
#  Cách dùng:
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#    docker compose -f docker-compose.prod.yml down
#
#  Cấu trúc .env.prod (xem .env.prod.example để biết thêm):
#    DB_NAME=url_shortener_prod
#    DB_USERNAME=auradev_prod
#    DB_PASSWORD=<strong-password>
#    REDIS_PASSWORD=<strong-redis-password>
#    JWT_SECRET=<64-byte-hex-secret>
#    KAFKA_BOOTSTRAP_SERVERS=kafka:29092
#    KAFKA_CLUSTER_ID=<base64-uuid>  # tạo bằng: kafka-storage random-uuid
# =============================================

name: url-shortener-prod

services:

  # ===== Spring Boot Application =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # CI đẩy image lên GHCR; trên server đặt APP_IMAGE/CADDY_IMAGE rồi `docker compose pull && up -d --no-build`.
    # Không đặt thì build tại chỗ như trước.
    image: ${APP_IMAGE:-url-shortener-app:local}
    container_name: url_shortener_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900000}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800000}
      JWT_ISSUER: ${JWT_ISSUER:-url-shortener-prod}
      # Shortener
      APP_BASE_URL: ${APP_BASE_URL}
      SHORT_CODE_SECRET: ${SHORT_CODE_SECRET}
      CLICK_VISITOR_SECRET: ${CLICK_VISITOR_SECRET}
      GEOIP_DATABASE: ${GEOIP_DATABASE:-}
      CLICK_RECONCILE_REPAIR: ${CLICK_RECONCILE_REPAIR:-false}
      # Admin (DataInitializer): application-prod.yaml bắt buộc các giá trị này
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Admin}
      # Observability (OTLP -> OpenObserve), mặc định tắt. Xem docs/observability.md
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:5080/api/default}
      OTEL_EXPORTER_OTLP_AUTHORIZATION: ${OTEL_EXPORTER_OTLP_AUTHORIZATION:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-url-shortener}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      # Trang "Giám sát" của admin đọc log từ OpenObserve (trống OPENOBSERVE_URL = tắt). Với profile observability:
      # OPENOBSERVE_URL=http://openobserve:5080
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
      OPENOBSERVE_UI_URL: ${OPENOBSERVE_UI_URL:-}
      OPENOBSERVE_EMAIL: ${OPENOBSERVE_EMAIL:-}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}
      # Server
      SERVER_PORT: ${SERVER_PORT:-8080}
    # Không publish cổng app ra host: chỉ Caddy (cùng mạng Docker) gọi được app. Nếu publish thì client đi vòng qua
    # Caddy, bỏ qua rate limit và HTTPS.
    expose:
      - "${SERVER_PORT:-8080}"
    # Dừng êm: timeout-per-shutdown-phase (30 s, application-prod.yaml) chờ request đang chạy, rồi executor gửi click xả
    # nốt hàng đợi. Phải lớn hơn tổng hai bước; mặc định của Docker là 10 s sẽ SIGKILL giữa chừng.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===== Caddy: HTTPS + reverse proxy + UI + rate limit =====
  # Điểm vào DUY NHẤT từ internet (80/443). Build từ thư mục gốc git (cần cả frontend/ lẫn caddy/Caddyfile).
  # Cấu hình routing và ngưỡng rate limit: caddy/Caddyfile (ngưỡng đổi được bằng biến RATE_LIMIT_* mà không cần build lại).
  # Phải cùng mạng Docker riêng với app: app chỉ tin X-Forwarded-For từ dải IP riêng (server.forward-headers-strategy).
  caddy:
    build:
      context: ..
      dockerfile: url-shortener/caddy/Dockerfile
    image: ${CADDY_IMAGE:-url-shortener-caddy:local}
    container_name: url_shortener_caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Domain công khai, vd go.example.com (Caddy tự lấy chứng chỉ Let's Encrypt; DNS phải đã trỏ về server).
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (public domain)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      APP_PORT: ${SERVER_PORT:-8080}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-240}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-15}
      RATE_LIMIT_UNLOCK_PER_MIN: ${RATE_LIMIT_UNLOCK_PER_MIN:-30}
      RATE_LIMIT_ANON_CREATE_PER_MIN: ${RATE_LIMIT_ANON_CREATE_PER_MIN:-20}
      RATE_LIMIT_REDIRECT_PER_MIN: ${RATE_LIMIT_REDIRECT_PER_MIN:-600}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      # Chứng chỉ và khoá tài khoản ACME: mất volume này thì phải xin lại (Let's Encrypt có giới hạn số lần xin)
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2019/config/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===== Backup PostgreSQL (pg_dump hằng ngày) =====
  # Bản dump ghi ra thư mục của HOST (BACKUP_DIR), nên đặt nó trên đĩa/phân vùng KHÁC với đĩa chứa volume Postgres,
  # nếu không đĩa hỏng là mất cả hai. Giữ 7 bản ngày + 4 bản tuần. Quy trình khôi phục và restore drill: docs/deployment.md.
  # Healthcheck báo lỗi nếu quá 26 giờ không có bản backup thành công.
  backup:
    image: postgres:16-alpine
    container_name: url_shortener_backup_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_AT: ${BACKUP_AT:-03:15}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./backup/backup.sh:/opt/backup/backup.sh:ro
      - ${BACKUP_DIR:?BACKUP_DIR is required (host directory for database backups)}:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 26h
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis_prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Kafka (KRaft mode — no Zookeeper) =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: url_shortener_kafka_prod
    restart: unless-stopped
    environment:
      # KRaft — không cần Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # Listeners (prod: không expose ra ngoài)
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Topic / replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    expose:
      - "29092"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===== Observability: OpenObserve (tuỳ chọn) =====
  # Chỉ chạy khi bật profile:  docker compose -f docker-compose.prod.yml --env-file .env.prod --profile observability up -d
  # rồi đặt trong .env.prod:
  #   OTEL_EXPORT_ENABLED=true
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
  #   OTEL_EXPORTER_OTLP_AUTHORIZATION="Basic <base64 của OPENOBSERVE_EMAIL:OPENOBSERVE_PASSWORD>"
  # Giao diện chỉ nghe trên 127.0.0.1 (không lộ ra internet): truy cập qua SSH tunnel hoặc reverse proxy có xác thực.
  # Nếu đã có backend OTLP khác thì không cần service này, chỉ trỏ OTEL_EXPORTER_OTLP_ENDPOINT tới đó.
  openobserve:
    image: openobserve/openobserve:v1.0.4
    container_name: url_shortener_openobserve_prod
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD}
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - openobserve_prod_data:/data
    networks:
      - prod_network

# ===== VOLUMES =====
volumes:
  caddy_prod_data:
    driver: local
  caddy_prod_config:
    driver: local
  openobserve_prod_data:
    driver: local
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  kafka_prod_data:
    driver: local

# ===== NETWORKS =====
networks:
  prod_network:
    driver: bridge
