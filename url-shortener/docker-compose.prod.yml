# =============================================
#  docker-compose.prod.yml
#  Mục đích: Full-stack production deployment.
#  Bao gồm: build BE từ Dockerfile + tất cả infra.
#
#  Yêu cầu: File .env.prod trong cùng thư mục (không commit lên git)
#
#  Cách dùng:
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#    docker compose -f docker-compose.prod.yml down
#
#  Cấu trúc .env.prod (xem .env.prod.example để biết thêm):
#    DB_NAME=url_shortener_prod
#    DB_USERNAME=auradev_prod
#    DB_PASSWORD=<strong-password>
#    REDIS_PASSWORD=<strong-redis-password>
#    JWT_SECRET=<64-byte-hex-secret>
#    KAFKA_BOOTSTRAP_SERVERS=kafka:29092
#    KAFKA_CLUSTER_ID=<base64-uuid>  # tạo bằng: kafka-storage random-uuid
# =============================================

name: url-shortener-prod

services:

  # ===== Spring Boot Application =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900000}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800000}
      JWT_ISSUER: ${JWT_ISSUER:-url-shortener-prod}
      # Shortener
      APP_BASE_URL: ${APP_BASE_URL}
      SHORT_CODE_SECRET: ${SHORT_CODE_SECRET}
      # Server
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis_prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Kafka (KRaft mode — no Zookeeper) =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: url_shortener_kafka_prod
    restart: unless-stopped
    environment:
      # KRaft — không cần Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # Listeners (prod: không expose ra ngoài)
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Topic / replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    expose:
      - "29092"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ===== VOLUMES =====
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  kafka_prod_data:
    driver: local

# ===== NETWORKS =====
networks:
  prod_network:
    driver: bridge
