# nginx cho docker-compose.scale.yml: cân bằng tải round-robin giữa các instance app.
#
# - `server app:8080` được phân giải lúc nginx khởi động thành MỌI địa chỉ của service `app` (Docker DNS trả
#   về một địa chỉ cho mỗi instance), mỗi địa chỉ là một peer. Đổi số instance phải khởi động lại nginx:
#   docker compose -f docker-compose.scale.yml restart nginx
# - max_fails/fail_timeout: instance chết bị loại khỏi vòng quay (passive health check) trong 5 giây.
# - proxy_next_upstream: request gặp lỗi kết nối được thử lại trên instance khác (an toàn vì GET idempotent;
#   POST không bị thử lại tự động).
# - X-Forwarded-For: Tomcat của app chỉ tin header này khi kết nối đến từ dải IP riêng (mạng Docker), để
#   rate limit theo IP thật của client.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    upstream app {
        server app:8080 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Trả nguyên 302 + Location của app, không viết lại
            proxy_redirect off;

            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
