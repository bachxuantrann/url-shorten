spring:
  # ===== DataSource =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener_db}
    username: ${DB_USERNAME:auradev}
    password: ${DB_PASSWORD:auradev123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # ===== Flyway =====
  # Schema do Flyway quản lý (db/migration). Hibernate chỉ validate.
  # baseline-on-migrate: DB dev cũ đã có bảng do ddl-auto sinh ra nhưng chưa có
  # flyway_schema_history sẽ được đánh dấu baseline V1 (rồi chạy tiếp V2...).
  # DB trống thì cờ này không có tác dụng. Có thể bỏ sau khi mọi DB dev đã chạy qua Flyway.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Timeout ngắn: Redis chậm không được kéo redirect chậm theo (circuit breaker lo phần còn lại)
      timeout: ${REDIS_TIMEOUT:300ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ===== Kafka =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true     # span cho mỗi lần gửi, truyền trace context qua header
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        # Producer không được chặn lâu khi broker chết (mặc định max.block.ms = 60s); mất event còn hơn
        # làm chậm redirect. delivery.timeout.ms phải >= linger.ms + request.timeout.ms.
        max.block.ms: 500
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
    consumer:
      group-id: url-shortener-group
      auto-offset-reset: earliest
      max-poll-records: 500       # kích thước lô tối đa của consumer click
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ===== App Custom Properties =====
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900000}        # 15 minutes in ms
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}   # 7 days in ms
    issuer: ${JWT_ISSUER:url-shortener-dev}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123456}
    email: ${ADMIN_EMAIL:admin@auradev.local}
    full-name: ${ADMIN_FULL_NAME:System Admin}
  shortener:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    ui-base-url: ${UI_BASE_URL:http://localhost:5173}   # UI (Vite) chạy ở cổng riêng khi dev; trình duyệt được chuyển sang đây
    code-secret: ${SHORT_CODE_SECRET:3b8a535abb7ec29b3b49383e0e6d22e64b74555ce6263071e7ce5c39bb4ead8e}
    cache-ttl: PT10M              # link được cache trong Redis tối đa 10 phút
    negative-cache-ttl: PT1M      # cache ngắn cho mã không tồn tại / link đã hết hạn
    expiry-job-enabled: true      # job chuyển link quá hạn sang EXPIRED
    expiry-job-interval: PT1M     # chu kỳ chạy job (ISO-8601)
    expiry-batch-size: 500        # số link mỗi lần UPDATE
    max-links-per-user: 1000      # số link (chưa xoá) tối đa mỗi user
    block-private-targets: ${BLOCK_PRIVATE_TARGETS:true}   # đặt false để rút gọn link tới localhost khi dev
    own-hosts: []                 # host phụ của chính dịch vụ (ngoài host của base-url), cấm làm URL đích

  click:
    topic: url-clicks
    partitions: 3
    replicas: 1
    consumer-concurrency: 1
    visitor-secret: ${CLICK_VISITOR_SECRET:dev-only-visitor-secret-change-me}
    geoip-database: ${GEOIP_DATABASE:}         # đường dẫn file GeoLite2-Country.mmdb; để trống = không ghi quốc gia
    partition-job-enabled: true
    partition-job-interval: PT6H
    partition-months-ahead: 3     # tạo sẵn phân vùng cho tháng này và các tháng tới
    retention-months: 13          # xoá phân vùng url_clicks cũ hơn 13 tháng (<= 0: giữ mãi)
    reconcile-job-enabled: true   # đối soát urls.click_count với url_daily_stats và url_daily_stats với url_clicks
    reconcile-job-interval: PT24H
    reconcile-repair: false       # true = tự sửa urls.click_count lệch (mặc định chỉ log cảnh báo)
    reconcile-batch-size: 1000
    reconcile-window-days: 2

  resilience:
    # Circuit breaker: mở khi >= failure-rate-threshold% trong sliding-window-size lần gọi gần nhất (tối thiểu
    # minimum-number-of-calls); khi mở thì bỏ qua ngay, sau wait-duration-in-open-state cho thăm dò.
    redis-cache:      { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: PT10S, permitted-calls-in-half-open: 3 }
    redis-rate-limit: { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: PT10S, permitted-calls-in-half-open: 3 }
    kafka-publish:    { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: PT15S, permitted-calls-in-half-open: 3 }

  rate-limit:
    anonymous-create: { limit: 10, window: PT1H }    # theo IP: tối đa 10 link ẩn danh mỗi giờ
    user-create: { limit: 100, window: PT1H }        # theo user: tối đa 100 link mỗi giờ
    unlock-per-ip: { limit: 30, window: PT15M }      # thử mở khoá link có mật khẩu: theo IP, mọi link
    unlock-per-link-and-ip: { limit: 10, window: PT15M }   # theo (link, IP): chặn đoán mật khẩu từ một nguồn
    unlock-per-link: { limit: 100, window: PT1H }    # theo link, mọi IP: chặn đoán mật khẩu phân tán
    report-per-ip: { limit: 5, window: PT1H }        # theo IP: tối đa 5 báo cáo lạm dụng mỗi giờ

# ===== Observability (OTLP -> OpenObserve) =====
# Mặc định TẮT xuất dữ liệu (OTEL_EXPORT_ENABLED=false) để không có lỗi kết nối khi chưa chạy OpenObserve; trace id vẫn
# có trong log. Bật: OTEL_EXPORT_ENABLED=true, đặt OTEL_EXPORTER_OTLP_ENDPOINT (gốc OTLP/HTTP; app thêm /v1/traces, /v1/metrics,
# /v1/logs) và, nếu backend yêu cầu, OTEL_EXPORTER_OTLP_AUTHORIZATION (giá trị header Authorization, vd "Basic ...").
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: ${OTEL_METRICS_STEP:30s}
        headers:
          Authorization: ${OTEL_EXPORTER_OTLP_AUTHORIZATION:}
  opentelemetry:
    resource-attributes:
      "[service.name]": ${OTEL_SERVICE_NAME:url-shortener}
      "[service.instance.id]": ${HOSTNAME:local}
      "[deployment.environment.name]": dev
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${OTEL_EXPORTER_OTLP_AUTHORIZATION:}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${OTEL_EXPORTER_OTLP_AUTHORIZATION:}

# ===== Server =====
# Tin X-Forwarded-For CHỈ khi kết nối đến từ proxy tin cậy (dải IP riêng/loopback mặc định của Tomcat)
# để rate limit theo IP thật của client khi chạy sau nginx/load balancer.
server:
  forward-headers-strategy: native
# ===== Logging =====
logging:
  level:
    root: INFO
    com.auradev: DEBUG
    org.springframework.kafka.support.LoggingProducerListener: "OFF"   # trùng với WARN của KafkaClickPublisher
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
