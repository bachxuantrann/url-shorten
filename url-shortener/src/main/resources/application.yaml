spring:
  application:
    name: url-shortener
  profiles:
    active: dev

  # ===== i18n =====
  messages:
    basename: i18n/message
    encoding: UTF-8
    use-code-as-default-message: false

  # ===== JPA =====
  jpa:
    open-in-view: false

  # ===== Jackson =====
  # Serialization features (write-dates-as-timestamps, fail-on-unknown-properties)
  # được cấu hình qua JacksonConfig.java để tránh IntelliJ enum-key false positive
  jackson:
    default-property-inclusion: non_null

  # ===== Encoding (Spring Boot 3+) =====
  mandatory-file-encoding: UTF-8

# ===== Actuator =====
# Chỉ expose /actuator/health (public, không lộ chi tiết) — dùng cho Docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}
