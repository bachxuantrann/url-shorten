api.success.url_created=Short link created successfully.
api.success.url_updated=Short link updated successfully.
api.success.url_disabled=Short link has been disabled.
api.success.url_enabled=Short link has been enabled.
api.success.url_deleted=Short link deleted successfully.

api.error.url_not_found=Short link ''{0}'' does not exist.
api.error.url_blocked=This link has been blocked and cannot be modified.
api.error.url_invalid_state=This action is not allowed for a link in status {0}.
api.error.url_expired=This link has expired. Update its expiry time first.
api.error.invalid_url=The URL is invalid. Only http/https URLs up to 2048 characters are allowed.
api.error.url_gone=This link has expired or been removed.
api.error.url_access_blocked=This link has been blocked because it violates our policy.

validation.url.required=URL cannot be blank.
validation.url.size=URL must not exceed {max} characters.
validation.url.expiresAt.future=Expiry time must be in the future.
