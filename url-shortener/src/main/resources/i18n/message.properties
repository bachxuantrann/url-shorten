# =============================================
#  message.properties (English - Default)
# =============================================

# ===== SUCCESS MESSAGES =====
api.success.user_registered=User registered successfully.
api.success.user_created=User created successfully.
api.success.login=Login successful.
api.success.logout=Logout successful.
api.success.logout_all=Logged out from all devices successfully.
api.success.token_refreshed=Token refreshed successfully.
api.success.profile_updated=Profile updated successfully.
api.success.password_changed=Password changed successfully.
api.success.user_locked=User account has been locked.
api.success.user_unlocked=User account has been unlocked.

# ===== ERROR — VALIDATION (ERR_001) =====
api.error.validation_failed=Validation failed. Please check the input data.

# ===== ERROR — USER (ERR_100 – ERR_199) =====
api.error.user_not_found=User with ID {0} does not exist.
api.error.username_exists=Username ''{0}'' is already taken.
api.error.email_exists=Email ''{0}'' is already registered.
api.error.account_inactive=Your account is not yet activated
api.error.account_banned=Your account has been suspended. Please contact support.
api.error.wrong_old_password=The current password is incorrect.
api.error.password_not_match=New password and confirmation do not match.

# ===== ERROR — AUTHENTICATION (ERR_200 – ERR_299) =====
api.error.invalid_credentials=Invalid username or password.
api.error.invalid_token=The token is invalid or malformed.
api.error.token_expired=The token has expired. Please log in again.
api.error.token_revoked=The token has been revoked.
api.error.refresh_token_not_found=Refresh token not found. Please log in again.
api.error.refresh_token_mismatch=Refresh token does not match. Please log in again.

# ===== ERROR — AUTHORIZATION (ERR_300 – ERR_399) =====
api.error.unauthorized=You are not authenticated. Please log in.
api.error.forbidden=You do not have permission to access this resource.

# ===== ERROR — SYSTEM (ERR_999) =====
api.error.unknown=An unexpected system error occurred. Please try again later.

# =============================================
#  VALIDATION MESSAGES — Used in @NotBlank, @Size, etc.
#  (mapped via {messageKey} in DTO annotations)
# =============================================

# --- Register ---
validation.username.required=Username cannot be blank.
validation.username.size=Username must be between {min} and {max} characters.
validation.username.pattern=Username may only contain letters, digits, dots, hyphens, and underscores.

validation.email.required=Email cannot be blank.
validation.email.invalid=Please provide a valid email address.

validation.password.required=Password cannot be blank.
validation.password.size=Password must be between {min} and {max} characters.
validation.password.pattern=Password must contain at least one uppercase letter, one lowercase letter, and one digit.

validation.fullName.required=Full name cannot be blank.
validation.fullName.size=Full name must not exceed {max} characters.

# --- Login ---
validation.credential.username.required=Username cannot be blank.
validation.credential.password.required=Password cannot be blank.

# --- Refresh Token ---
validation.refreshToken.required=Refresh token cannot be blank.

# --- Change Password ---
validation.oldPassword.required=Current password cannot be blank.
validation.newPassword.required=New password cannot be blank.
validation.newPassword.size=New password must be between {min} and {max} characters.
validation.confirmPassword.required=Password confirmation cannot be blank.

