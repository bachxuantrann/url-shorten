# ===== ERROR — AUTHENTICATION (ERR_200 – ERR_299) =====
api.error.invalid_credentials=Tên đăng nhập hoặc mật khẩu không chính xác.
api.error.invalid_token=Token không hợp lệ hoặc bị lỗi định dạng.
