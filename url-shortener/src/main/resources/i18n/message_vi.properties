api.error.token_revoked=Token đã bị thu hồi.
api.error.refresh_token_not_found=Không tìm thấy refresh token. Vui lòng đăng nhập lại.
api.error.refresh_token_mismatch=Refresh token không khớp. Vui lòng đăng nhập lại.

# ===== ERROR — AUTHORIZATION (ERR_300 – ERR_399) =====
api.error.unauthorized=Bạn chưa đăng nhập. Vui lòng đăng nhập để tiếp tục.
api.error.forbidden=Bạn không có quyền truy cập tài nguyên này.

# ===== ERROR — SYSTEM (ERR_999) =====
api.error.unknown=Đã xảy ra lỗi hệ thống không xác định. Vui lòng thử lại sau.

